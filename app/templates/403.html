<!DOCTYPE html> <html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Acceso denegado</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: white;
        padding: 20px;
    }

    .container {
        max-width: 500px;
        width: 100%;
        text-align: center;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        padding: 50px 35px;
        backdrop-filter: blur(12px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .icon {
        width: 90px;
        height: 90px;
        margin: 0 auto 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: rgba(239, 68, 68, 0.15);
        border: 2px solid rgba(239, 68, 68, 0.4);
        font-size: 42px;
    }

    .error-code {
        font-size: 80px;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 15px;
        color: #f87171;
    }

    h1 {
        font-size: 28px;
        margin-bottom: 12px;
    }

    p {
        color: #cbd5e1;
        line-height: 1.6;
        margin-bottom: 30px;
    }

    .button {
        display: inline-block;
        padding: 13px 25px;
        border-radius: 12px;
        background: #3b82f6;
        color: white;
        text-decoration: none;
        font-weight: 600;
        transition: 0.2s ease;
    }

    .button:hover {
        background: #2563eb;
        transform: translateY(-2px);
    }

    .secondary {
        display: block;
        margin-top: 18px;
        color: #94a3b8;
        text-decoration: none;
        font-size: 14px;
    }

    .secondary:hover {
        color: white;
    }
</style>

</head> <body>
<div class="container">

    <div class="icon">
        🔒
    </div>

    <div class="error-code">
        403
    </div>

    <h1>Acceso denegado</h1>

    <p>
        No tienes permisos para acceder a esta sección.
        Si crees que esto es un error, contacta con el administrador.
    </p>

    

    <a href="javascript:history.back()" class="secondary">
        ← Volver a la página anterior
    </a>

</div>

</body> </html>
